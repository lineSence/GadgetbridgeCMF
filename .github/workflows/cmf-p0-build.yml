name: CMF P0 build

on:
  push:
    branches:
      - feature/cmf-p0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply CMF P0 patch
        shell: bash
        run: |
          cat > /tmp/cmf_p0.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/cmf_p0.patch.gz.b64 > /tmp/cmf_p0.patch.gz
          gunzip -c /tmp/cmf_p0.patch.gz > /tmp/cmf_p0.patch
          patch --batch --forward -p1 < /tmp/cmf_p0.patch

      - name: Run CMF P0 unit tests
        run: ./gradlew :app:testMainlineDebugUnitTest --no-daemon --stacktrace

      - name: Build Mainline debug APK
        run: ./gradlew :app:assembleMainlineDebug --no-daemon --stacktrace

      - name: Publish source changes to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/nodomain/freeyourgadget/gadgetbridge/service/devices/cmfwatchpro/CmfActivitySync.java \
                  app/src/main/java/nodomain/freeyourgadget/gadgetbridge/service/devices/cmfwatchpro/CmfPreferences.java \
                  app/src/main/java/nodomain/freeyourgadget/gadgetbridge/service/devices/cmfwatchpro/CmfProtocolUtils.java \
                  app/src/main/java/nodomain/freeyourgadget/gadgetbridge/service/devices/cmfwatchpro/CmfWatchProSupport.java \
                  app/src/main/java/nodomain/freeyourgadget/gadgetbridge/devices/cmfwatchpro/CmfWatchProCoordinator.java \
                  app/src/test/java/nodomain/freeyourgadget/gadgetbridge/service/devices/cmfwatchpro/CmfProtocolUtilsTest.java
          git diff --cached --quiet || git commit -m "CMF Watch Pro 2: implement P0 stabilization [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Collect APK
        uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-cmf-p0-mainline-debug
          path: app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error
          retention-days: 14
